const EYES = { ambre: ['Ambre', '#e8a33c', 'ambre'], vert: ['Vert', '#8cc77a', 'verts'], bleu: ['Bleu', '#7cb6e8', 'bleus'], noisette: ['Noisette', '#a8794a', 'noisette'], cuivre: ['Cuivre', '#e2772c', 'cuivre'] };
const WORDS = {

const ACCS = [
  { id: null, name: 'Aucun', cost: 0 },
  { id: 'echarpe', name: 'Écharpe', cost: 50 },
  { id: 'noeud', name: 'Nœud', cost: 30 },
  { id: 'bonnet', name: 'Bonnet', cost: 60 },
  { id: 'grelot', name: 'Grelot', cost: 40 },

const ITEMS = [
  { id: 'guirlande', name: 'Guirlande de pompons', cost: 40, desc: 'Égaye le mur du salon.' },
  { id: 'plaid', name: 'Plaid moutarde', cost: 60, desc: 'Plié dans un coin.' },

  { id: 'souris', name: 'Souris tricotée', cost: 20, desc: 'Son jouet préféré.' },
];
const ROOMS = ['Salon', 'Cuisine', 'Grenier', 'Jardin', 'Atelier', 'Mercerie'];
const NLEVELS = 11;

// ---------- save (local, per browser) ----------
const DEFAULT = { laine: 128, fur: 'roux', eyes: 'ambre', acc: null, accOwned: {}, items: {}, levels: {}, pets: 0, yarn: 0, sfx: true, music: true, vib: true, reduce: false, cb: false, hintSeen: false, tutDone: false, tuts: {}, seenRules: {}, name: '', named: false, daily: {}, best: {}, seenUnlock: {}, knit: {}, wish: null };
const Save = JSON.parse(JSON.stringify(DEFAULT));
try { Object.assign(Save, JSON.parse(localStorage.getItem('pelote-demo-v2') || '{}')); } catch (e) {}
if (!Save.knit) Save.knit = {}; Object.keys(Save.items || {}).forEach(k => { Save.knit[k] = true; });
if (!FURS[Save.fur]) Save.fur = ({ creme: 'maine', calico: 'fold' })[Save.fur] || 'roux';
if (!EYES[Save.eyes]) Save.eyes = FURS[Save.fur].defEyes;
const persist = () => { try { localStorage.setItem('pelote-demo-v2', JSON.stringify(Save)); } catch (e) {} };
const NAME_IDEAS = ['Biscotte', 'Moka', 'Pistache', 'Caramel', 'Plume', 'Noisette', 'Filou', 'Mochi', 'Pompon', 'Cannelle', 'Grisou', 'Praline'];
const cleanName = (v) => { v = (v || '').replace(/[^\p{L}\p{N} '’-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 12); return v ? v[0].toUpperCase() + v.slice(1) : ''; };
// HTML name picker over the canvas (real text field : mobile keyboard, accents…)
function askName(title, cancelLabel, done) {
  const box = document.getElementById('namebox'), inp = document.getElementById('nb-input');
  document.getElementById('nb-title').textContent = title;
  const cancel = document.getElementById('nb-cancel'), ok = document.getElementById('nb-ok');
  cancel.textContent = cancelLabel;
  inp.value = catName();
  const sugg = document.getElementById('nb-sugg'); sugg.innerHTML = '';
  NAME_IDEAS.filter(n => n !== catName()).sort(() => Math.random() - 0.5).slice(0, 5).forEach(n => { const b = document.createElement('button'); b.type = 'button'; b.textContent = n; b.onclick = () => { inp.value = n; inp.focus(); Sound.pop(700, 0.08, 'triangle', 0.08); }; sugg.appendChild(b); });
  if (window.__game) window.__game.input.enabled = false;
  const close = (val) => { box.hidden = true; setTimeout(() => { if (window.__game) window.__game.input.enabled = true; }, 250); inp.onkeydown = null; ok.onclick = cancel.onclick = box.onclick = null; done(val); };
  ok.onclick = () => { Sound.pop(560, 0.1, 'triangle', 0.12); close(cleanName(inp.value) || catName()); };
  cancel.onclick = () => close(null);
  box.onclick = (e) => { if (e.target === box) close(null); };
  inp.onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Enter') ok.onclick(); if (e.key === 'Escape') close(null); };
  if (!box.__guard) { box.__guard = true; ['mousedown', 'mouseup', 'pointerdown', 'pointerup', 'touchstart', 'touchend'].forEach(t => box.addEventListener(t, (e) => e.stopPropagation())); }
  box.hidden = false; setTimeout(() => { inp.focus(); inp.select(); }, 60);
}
const buzz = (ms = 10) => { if (Save.vib) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} } };
const totalStars = () => Object.values(Save.levels).reduce((a, b) => a + b, 0);
const salonDone = () => { for (let n = 1; n <= NLEVELS; n++) if (!Save.levels[n]) return false; return true; };
const dailyCount = () => Object.keys(Save.daily || {}).length;
const dailyStreak = () => { const D = Save.daily || {}; const d = new Date(); if (!D[dayKey(d)]) d.setDate(d.getDate() - 1); let n = 0; while (D[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); } return n; };
const lockedFur = (id) => id === 'siamois' ? !salonDone() : id === 'fold' ? dailyCount() < 3 : false;
const dateLabel = (d = new Date()) => { const t = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); return t.charAt(0).toUpperCase() + t.slice(1); };
const currentLevel = () => { for (let n = 1; n <= NLEVELS; n++) if (!Save.levels[n]) return n; return NLEVELS; };
const PLAYABLE = { 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true, 8: true, 9: true, 10: true, 11: true };

// ---------- puzzle du jour : a board generated from the date, kept only if the solver proves it fair
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
// one solver for everything : yarn that can't cross itself, buttons, bonus balls (+5), ducks to push, spools that cut the yarn (once each)
function solveGrid(grid, budget, cap = 250000, st = null) {
  const R = grid.length, C = grid[0].length; let S, K; const btn = new Set();
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const ch = grid[r][c], k = c + ',' + r; if (ch === 'S') S = [c, r]; if (ch === 'K') K = [c, r]; if (ch === 'b') btn.add(k); }
  const toys = new Set(), tb = new Set(), ty = new Set(), ur = new Set(); let on, pos;
  if (st) { pos = st.pos; on = new Set(st.live); st.toys.forEach(k => toys.add(k)); st.takenB.forEach(k => tb.add(k)); st.takenY.forEach(k => ty.add(k)); st.usedR.forEach(k => ur.add(k)); }
  else { pos = S; on = new Set([S[0] + ',' + S[1]]); for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (grid[r][c] === 'M') toys.add(c + ',' + r); }
  const walk = (c, r) => c >= 0 && r >= 0 && c < C && r < R && 'SKby.MR'.includes(grid[r][c]);
  const duckOk = (c, r) => c >= 0 && r >= 0 && c < C && r < R && '.M'.includes(grid[r][c]);
  let best = null, bestScore = -1, nodes = 0, three = 0; const route = [];
  const dfs = (c, r, rem, ban) => {
    if (++nodes > cap) return;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dx, nr = r + dy, k = nc + ',' + nr;
      if (rem <= 0 || k === ban || on.has(k) || !walk(nc, nr)) continue;
      let mv = null;
      if (toys.has(k)) { const ux = nc + dx, uy = nr + dy, uk = ux + ',' + uy; if (!duckOk(ux, uy) || toys.has(uk) || on.has(uk)) continue; toys.delete(k); toys.add(uk); mv = [k, uk]; }
      const ch = grid[nr][nc]; route.push([nc, nr]);
      const nb = ch === 'b' && !tb.has(k), ny = ch === 'y' && !ty.has(k), cut = ch === 'R' && !ur.has(k);
      if (nb) tb.add(k); if (ny) ty.add(k);
      const rm = rem - 1 + (ny ? 5 : 0); const saved = on;
      if (cut) { ur.add(k); on = new Set([k]); } else on.add(k);
      if (nc === K[0] && nr === K[1]) { const sc = tb.size * 1000 + rm * 10 - route.length * 0.01; if (tb.size === btn.size && rm >= 3) three++; if (sc > bestScore) { bestScore = sc; best = { route: route.slice(), got: tb.size, rem: rm }; } }
      else dfs(nc, nr, rm, cut ? c + ',' + r : null);   // right after a cut, stepping back would be a rewind
      if (cut) { ur.delete(k); on = saved; } else on.delete(k);
      if (nb) tb.delete(k); if (ny) ty.delete(k);
      route.pop(); if (mv) { toys.delete(mv[1]); toys.add(mv[0]); }
    }
  };
  dfs(pos[0], pos[1], budget, st ? st.ban : null);
  return { best, complete: nodes <= cap, nb: btn.size, three, nodes };
}
function makeDaily(key) {
  let seed = 0; for (const ch of key) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const day = new Date(key + 'T12:00:00').getDay(), weekend = day === 0 || day === 6;
  const light = pick(['matin', 'aprem', 'soir']), decor = Math.floor(rnd() * 3);
  for (let tries = 0; tries < 400; tries++) {
    const C = pick([5, 6, 6]), R = 6, g = Array.from({ length: R }, () => Array(C).fill('.'));
    const cells = []; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) cells.push([c, r]);
    const sc = Math.floor(rnd() * C); g[R - 1][sc] = 'S';
    const kc = pick(cells.filter(([c, r]) => r <= 1)); g[kc[1]][kc[0]] = 'K';
    const free = cells.filter(([c, r]) => g[r][c] === '.'); for (let i = free.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [free[i], free[j]] = [free[j], free[i]]; }
    const nw = Math.round(C * R * (0.28 + rnd() * 0.08)); let i = 0;
    for (; i < nw; i++) g[free[i][1]][free[i][0]] = pick(['O', 'O', 'O', 'P', 'B', 'B', 'C', 'L']);
    const nb = weekend ? 3 : 2; for (let j = 0; j < nb; j++, i++) g[free[i][1]][free[i][0]] = 'b';
    const duck = rnd() < (weekend ? 0.6 : 0.3); if (duck) { g[free[i][1]][free[i][0]] = 'M'; i++; }
    const lamps = cells.filter(([c, r]) => g[r][c] === 'L'); lamps.slice(1).forEach(([c, r]) => { g[r][c] = 'O'; });
    const A = solveGrid(g, 22, 120000);
    if (!A.complete || !A.best || A.best.got < nb) continue;
    const len = A.best.route.length; if (len < 11 || len > 19) continue;
    const B = solveGrid(g, len + 3, 120000); if (!B.complete || B.three > 8) continue;
    if (duck) { const g2 = g.map(row => row.map(ch => ch === 'M' ? 'O' : ch)); const D = solveGrid(g2, len + 3, 120000); if (D.best && D.best.got === nb && D.best.rem >= A.best.rem - (22 - len - 3)) continue; }
    return { title: 'Puzzle du jour', light, decor, budget: len + 3, keep: 3, rules: [], map: g, daily: key };
  }
  return { title: 'Puzzle du jour', light, decor, budget: 16, keep: 3, rules: [], daily: key, map: ['. . K . . .', '. . O . O P', '. . M . O .', 'C O O M . .', 'B b . . . L', '. b . . S .'].map(l => l.split(' ')) };
}

// ---------- tiny sound synth ----------
const Sound = {
  ctx: null, purrNode: null, unlocked: false,
  ensure() {
    if (!this.unlocked) return null;
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  pop(f = 520, dur = 0.12, type = 'sine', vol = 0.18) {
    if (!Save.sfx) return; const c = this.ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(f * 0.55, c.currentTime + dur);
    g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + dur + 0.02);
  },
  chime() { [660, 880, 1320].forEach((f, i) => setTimeout(() => this.pop(f, 0.25, 'triangle', 0.08), i * 70)); },
  fanfare() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => setTimeout(() => this.pop(f, i === 5 ? 0.5 : 0.16, 'triangle', 0.1), i * 110)); },
  // ---- music : a gentle generative loop, one flavour per moment of the day (and one for home)

class Base extends Phaser.Scene {
  img(x, y, frame) { return this.add.image(x, y, 'A', frame); }

  tapify(target, onTap, scaleTo = 0.92) {
    target.setInteractive({ useHandCursor: true });
    const node = target.parentContainer && !target.parentContainer.noTapScale ? target.parentContainer : target;
    const base = node.scale;
    target.on('pointerdown', (p, lx, ly, ev) => { ev && ev.stopPropagation(); target.__down = true; Sound.ensure(); this.tweens.add({ targets: node, scale: base * scaleTo, duration: 80 }); });
    target.on('pointerup', (p, lx, ly, ev) => { ev && ev.stopPropagation(); if (!target.__down) return; target.__down = false; this.tweens.add({ targets: node, scale: base, duration: 300, ease: 'Back.easeOut' }); Sound.pop(560, 0.1, 'triangle', 0.12); buzz(10); onTap(); });
    target.on('pointerout', () => { target.__down = false; this.tweens.add({ targets: node, scale: base, duration: 200 }); });
  }

  pillBtn(x, y, w, h, label, color, onTap, opts = {}) {
    const c = this.add.container(x, y);
    const g = this.add.graphics();
    const dark = Phaser.Display.Color.IntegerToColor(color).darken(25).color;

    g.lineStyle(2.5, 0xffffff, 0.6); g.strokeRoundedRect(-w / 2 + 8, -h / 2 + 7, w - 16, h - 14, (h - 14) / 2);
    const items = [g];
    if (opts.icon) items.push(this.img(label ? -w / 2 + 44 : 0, -2, opts.icon).setScale(0.5));
    const t = this.txt(opts.icon ? 18 : 0, -2, label, opts.size || 30, { fontStyle: '700', color: opts.ink || '#fff6ea' }).setOrigin(0.5);
    const hit = this.add.zone(0, 0, w, h + 8);
    items.push(t, hit); c.add(items); c.label = t; c.hit = hit;
    if (onTap) this.tapify(hit, onTap, 0.94);
    return c;
  }

    if ((hl.x / 66) ** 2 + ((hl.y + 8) / 60) ** 2 < 1) return hl.y > 14 ? 'chin' : 'head';

    }
  }
  headTop(dy = -70) { return this.world(this.r.head, 0, dy); }
  hearts(n = 1) { const p = this.headTop(-40); this.fxAt(p.x, p.y, 'heart', n); }
  bubble(text, ms = 1400) {

    if (this.bub) this.bub.destroy();

    const bx = Math.min(p.x + 26, W - w + 4), b = this.s.add.container(bx, p.y).setDepth(this.depth + 1);
    const g = this.s.add.graphics(); g.fillStyle(0x7a3518, 0.18); g.fillRoundedRect(-20, -66, w, 64, 32); g.fillStyle(0xfffaf2, 1); g.fillRoundedRect(-20, -70, w, 64, 32); const tx = Math.max(0, Math.min(w - 60, p.x + 26 - bx)); g.fillTriangle(tx, -10, tx - 6, 12, tx + 24, -8);

  }
  word() { const w = WORDS[this.P]; return w[Math.floor(Math.random() * w.length)]; }
  meow(text) { this.r.head.say('open', 450); Sound.pop(this.P === 'bavard' ? 980 : 820, 0.16, 'triangle', 0.1); setTimeout(() => Sound.pop(this.P === 'bavard' ? 1300 : 1050, 0.2, 'triangle', 0.08), 110); this.bubble(text || this.word()); }
  headTo(dy, rot, ms = 380, ease = 'Back.easeOut') { const h = this.r.head; this.s.tweens.killTweensOf(h); this.s.tweens.add({ targets: h, y: this.r.headBase.y + dy, rotation: rot, duration: ms, ease }); }

      if (zone === 'head') { h.setMood('happy'); this.headTo(-30, 0.02, 260); this.s.tweens.add({ targets: h, rotation: { from: -0.12, to: 0.08 }, duration: 420, yoyo: true, repeat: -1, ease: 'Sine.easeInOut', delay: 260 }); }

  }
}

    this.dust = this.add.particles(0, 0, 'A', { frame: 'dot', emitZone: { type: 'random', source: beamZone }, lifespan: { min: 3500, max: 6500 }, speedX: { min: -8, max: 8 }, speedY: { min: -12, max: 6 }, scale: { start: 0.55, end: 0.15 }, alpha: { start: 0.9, end: 0 }, frequency: 140, blendMode: 'ADD' });

      this.brain.look(p.x, p.y);

      if (this.grab != null) { const pt = this.rope[this.grab]; const lp = this.toRoom(p); Save.yarn += Math.hypot(lp.x - pt.x, lp.y - pt.y) / 100; pt.x = lp.x; pt.y = lp.y; pt.px = lp.x; pt.py = lp.y; }
    });
    this.input.on('pointerdown', (p) => {
      if (this.panel || this.transit) return;
      const zone = this.brain.hit(p.x, p.y);
      if (zone) { this.hideHint(); this.touching = true; this.brain.down(zone, p); return; }
      const lp = this.toRoom(p); let best = -1, bd = 46 * 46;
      for (let i = 2; i < this.rope.length - 2; i++) { const d = (this.rope[i].x - lp.x) ** 2 + (this.rope[i].y - lp.y) ** 2; if (d < bd) { bd = d; best = i; } }
      if (best >= 0) { this.grab = best; Sound.pop(300, 0.08, 'triangle', 0.08); buzz(8); }
    });
    this.input.on('pointerup', () => { if (this.touching) { this.touching = false; this.brain.up(); } if (this.grab != null) { this.grab = null; this.wiggleBall(); persist(); } });

    if (this.registry.get('fromLevel')) { this.registry.set('fromLevel', false); this.transit = true; this.curtainUp(); if (this.registry.get('afterLevelToast')) { const m = this.registry.get('afterLevelToast'); this.registry.set('afterLevelToast', null); this.time.delayedCall(1100, () => this.toast(m)); } }
    else if (intro) this.cameras.main.fadeIn(600, 248, 210, 169);
    this.time.addEvent({ delay: 2300, loop: true, callback: () => this.brain.state === 'sleep' && !Save.reduce && this.spawnZ() });
    if (!Save.hintSeen) this.time.delayedCall(3800, () => this.showHint());
  }

  // ---------- yarn toy (ends under the cat's front paw)
  anchors() { return [{ x: this.redBall.x + 18, y: this.redBall.y + 8 }, { x: this.cat.root.x + 40, y: this.cat.root.y + 30 }]; }
  initYarn() {
    const [a, b] = this.anchors(); const N = 30; this.rope = [];
    for (let i = 0; i < N; i++) { const s = i / (N - 1); const x = a.x + (b.x - a.x) * s, y = a.y + (b.y - a.y) * s + Math.sin(s * Math.PI) * 40; this.rope.push({ x, y, px: x, py: y }); }
    this.segLen = (Math.hypot(b.x - a.x, b.y - a.y) * 1.18) / (N - 1);
  }
  stepYarn() {
    const R = this.rope, [a, b] = this.anchors();
    for (let i = 1; i < R.length - 1; i++) {
      if (i === this.grab) continue;
      const p = R[i]; const vx = (p.x - p.px) * 0.95, vy = (p.y - p.py) * 0.95;
      p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + 0.22;
      const maxY = RY + B * 2 - 30; if (p.y > maxY) p.y = maxY;
    }
    R[0].x = a.x; R[0].y = a.y; R[R.length - 1].x = b.x; R[R.length - 1].y = b.y;
    for (let k = 0; k < 8; k++) for (let i = 0; i < R.length - 1; i++) {
      const p = R[i], q = R[i + 1]; const dx = q.x - p.x, dy = q.y - p.y; const d = Math.hypot(dx, dy) || 0.001;
      if (d < this.segLen) continue;
      const diff = (d - this.segLen) / d * 0.5;
      const fP = i === 0 || i === this.grab, fQ = i + 1 === R.length - 1 || i + 1 === this.grab;
      if (!fP && !fQ) { p.x += dx * diff; p.y += dy * diff; q.x -= dx * diff; q.y -= dy * diff; }
      else if (fP && !fQ) { q.x -= dx * diff * 2; q.y -= dy * diff * 2; }
      else if (!fP && fQ) { p.x += dx * diff * 2; p.y += dy * diff * 2; }
    }
    if (this.grab != null) { const g = R[this.grab], rb = this.redBall; rb.x = Phaser.Math.Linear(rb.x, rb.homeX + Phaser.Math.Clamp((g.x - rb.homeX) * 0.03, -14, 14), 0.2); rb.y = Phaser.Math.Linear(rb.y, rb.homeY + Phaser.Math.Clamp((g.y - rb.homeY) * 0.03, -18, 8), 0.2); rb.rotation += 0.02; }
  }
  drawYarn() {
    let motion = 0; this.rope.forEach(p => { motion += Math.abs(p.x - p.px) + Math.abs(p.y - p.py); });
    const ox = Math.round(this.room.x * 2), oy = Math.round(this.room.y * 2);
    if (motion < 0.05 && this.yarnDrawn && this.grab == null) return;
    this.yarnDrawn = true;
    const g = this.yarnG; g.clear();
    const pts = new Phaser.Curves.Spline(this.rope.map(p => new Phaser.Math.Vector2(p.x, p.y))).getPoints(60);
    yarnStroke(g, pts);
  }
  wiggleBall() { const b = this.redBall; Sound.pop(420, 0.1, 'sine', 0.1); this.tweens.add({ targets: b, x: b.homeX, y: b.homeY, duration: 500, ease: 'Elastic.easeOut' }); }
  bounceBall(b) { Sound.pop(500 + Math.random() * 300, 0.12, 'triangle', 0.1); buzz(8); this.tweens.add({ targets: b, y: b.homeY - 34, rotation: b.rotation + 0.8, duration: 200, yoyo: true, ease: 'Quad.easeOut', onComplete: () => { b.y = b.homeY; } }); }

// shared yarn stroke : shadow, dark core, light core, twist ticks
function yarnStroke(g, pts, w = 9) {
  if (pts.length < 2) return;
  const line = (width, col, alpha, ox = 0, oy = 0) => { g.lineStyle(width, col, alpha); g.beginPath(); g.moveTo(pts[0].x + ox, pts[0].y + oy); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x + ox, pts[i].y + oy); g.strokePath(); };
  line(w + 1, 0x5a1e10, 0.18, 3, 6);
  line(w, 0xa8302d, 1);
  const a = pts[0], z = pts[pts.length - 1];
  g.fillStyle(0xa8302d, 1); g.fillCircle(a.x, a.y, w / 2); g.fillCircle(z.x, z.y, w / 2);
  line(w - 3, 0xe2524a, 1, 0, -1);
  // twist ticks : one single path for all of them (cheap to render)
  g.lineStyle(2, 0xff9c8f, 0.9); g.beginPath();
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i - 1], q = pts[i]; const dx = q.x - p.x, dy = q.y - p.y; const l = Math.hypot(dx, dy) || 1; const nx = -dy / l, ny = dx / l;
    for (let s = (9 - acc % 9); s < l; s += 9) { const x = p.x + dx * s / l, y = p.y + dy * s / l; g.moveTo(x - nx * 3 - dx / l * 2.5, y - ny * 3 - dy / l * 2.5 - 1); g.lineTo(x + nx * 3 + dx / l * 2.5, y + ny * 3 + dy / l * 2.5 - 1); }
    acc += l;
  }
  g.strokePath();
}

    this.tweens.add({ targets: prog, p: 1, duration: 420, ease: 'Sine.easeInOut', onUpdate: () => { this.catPos.x = from.x + (s.x - from.x) * prog.p; this.catPos.y = from.y + (s.y - from.y) * prog.p; this.cat.root.setPosition(this.catPos.x, this.catPos.y - Math.sin(prog.p * Math.PI) * 40); this.cat.phase += 0.3; this.placeBall(false); },
      onComplete: () => { this.cat.moving = 0; this.cat.root.sortY = this.front(...this.start) + 0.5; this.placeBall(false); this.objs.sort('sortY'); this.busy = false; this.refreshHUD(); this.drawHighlights(); } });

  }

  moveCat(fc, fr, tc, tr, forward) {
    this.busy = true; this.mode = forward ? 'fwd' : 'back';
    const a = this.tf(fc, fr), b = this.tf(tc, tr);
    const fwdDepth = this.front(tc, tr) > this.front(fc, fr);
    if (fwdDepth) { this.cat.root.sortY = this.front(tc, tr) + 0.5; this.ball.sortY = this.cat.root.sortY + 0.1; this.objs.sort('sortY'); }
    const prog = { p: 0 }; this.cat.moving = 1; const hop = 7 * this.G.k;
    this.tweens.add({ targets: prog, p: 1, duration: this.fastBack && !forward ? 90 : 160, ease: 'Sine.easeInOut',
      onUpdate: () => { this.catPos.x = a.x + (b.x - a.x) * prog.p; this.catPos.y = a.y + (b.y - a.y) * prog.p; this.cat.root.setPosition(this.catPos.x, this.catPos.y - Math.sin(prog.p * Math.PI) * hop); this.cat.phase += 0.45; this.placeBall(false); },
      onComplete: () => {
        if (!fwdDepth) { this.cat.root.sortY = this.front(tc, tr) + 0.5; this.ball.sortY = this.cat.root.sortY + 0.1; this.objs.sort('sortY'); }
        this.mode = 'idle'; this.busy = false; this.cat.moving = 0;

    this.tweens.add({ targets: this.ball, scale: this.ballScale(), duration: this.fastBack && !forward ? 90 : 160 });
  }

  // spool : the yarn behind is wound onto it, the trail is free again
  cutYarn(key) {
    const sp = this.spools[key]; sp.used = true; this.cuts.push(this.path.length - 1); this.yarnKey = null;
    // the old trail whips into the spool
    const old = [this.cuts.length > 1 ? this.tf(...this.path[this.cuts[this.cuts.length - 2]]) : this.anchor, ...this.path.slice(this.cuts.length > 1 ? this.cuts[this.cuts.length - 2] : 0, this.path.length).map(([c, r]) => this.tf(c, r))];
    const ghost = this.add.graphics(); this.world.addAt(ghost, this.world.getIndex(this.yarnG)); const pr = { p: 0 };
    const draw = () => { ghost.clear(); const n = Math.max(2, Math.ceil(old.length * (1 - pr.p))); const pts = old.slice(old.length - n); if (pts.length > 1) { ghost.setAlpha(1 - pr.p * 0.5); yarnStroke(ghost, pts, Math.round(9 * Math.min(1.25, this.G.k))); } };
    draw(); this.tweens.add({ targets: pr, p: 1, duration: Save.reduce ? 1 : 420, ease: 'Cubic.easeIn', onUpdate: draw, onComplete: () => { ghost.destroy(); sp.setFrame('t_spool_full'); if (!Save.reduce) this.tweens.add({ targets: sp, scaleX: { from: sp.scaleX * 1.25, to: sp.scaleX }, scaleY: { from: sp.scaleY * 0.8, to: sp.scaleY }, duration: 300, ease: 'Back.easeOut' }); } });
    Sound.pop(1200, 0.05, 'square', 0.05); setTimeout(() => Sound.pop(520, 0.3, 'triangle', 0.1), 90); buzz(18); this.mood('play', 700);
    this.floatText(sp.x, sp.y - 50 * this.G.k, 'Coupé !', '#4f8a7a');
    if (!this.cutSaid) { this.cutSaid = true; this.say('Coupé ! L\'ancien fil est rangé : tu peux repasser dessus.', 3600); }
  }
  arrive(c, r, forward) {
    const key = c + ',' + r;
    if (forward && this.buttons[key] && !this.buttons[key].taken) this.collect(key);
    if (forward && this.refills[key] && !this.refills[key].taken) this.absorb(key);
    if (forward && this.spools[key] && !this.spools[key].used) this.cutYarn(key);
    if (!forward) Object.entries(this.buttons).forEach(([k, b]) => { if (b.taken && !this.path.some(([x, y]) => x + ',' + y === k)) this.uncollect(k); });
    if (forward && c === this.goal[0] && r === this.goal[1]) { this.win(); return; }
    if (forward && this.remaining === 0) { this.mood('sad'); this.say('Plus de laine ! Reviens sur tes pas pour l\'enrouler.', 3000); this.pulseUndo(); return; }
    if (forward) this.checkDeadEnd();
    if (this.L.tut === 'push' && this.tut === 'start' && !this.deadSaid) { const t = DIRS.map(([dx, dy]) => this.toyAt(c + dx, r + dy)).find(Boolean); const sol = t && this.solveToys(); if (sol && sol[0][0] === t.c && sol[0][1] === t.r) this.tutorial('near', t); }
    const near = DIRS.map(([dx, dy]) => [c + dx, r + dy, dx, dy]).find(([x, y]) => this.toyAt(x, y) || (this.buttons[x + ',' + y] && !this.buttons[x + ',' + y].taken) || (this.refills[x + ',' + y] && !this.refills[x + ',' + y].taken) || (this.mouseTile && x === this.mouseTile[0] && y === this.mouseTile[1]));
    if (near && !this.moodTimer) { this.cat.head.setMood('curious'); this.cat.head.lookAt(near[2] * this.cat.dir, near[3]); if (this.mouseTile && near[0] === this.mouseTile[0] && near[1] === this.mouseTile[1]) this.squeak(); }
    else if (!this.moodTimer && this.cat.head.S.mood === 'curious') this.cat.head.setMood('idle');
  }
  squeak() { const m = this.mouseToy; if (!m || this.tweens.isTweening(m)) return; Sound.pop(1800, 0.06, 'square', 0.03); this.tweens.add({ targets: m, y: m.baseY - 14, angle: { from: -15, to: 15 }, duration: 160, yoyo: true, repeat: 1, onComplete: () => { m.angle = 0; m.y = m.baseY; } }); }

  // can the kitten still reach the basket ? (free tiles not on the yarn, enough laine)
  reach() {
    const [hc, hr] = this.head(); const seen = new Set(this.path.map(([c, r]) => c + ',' + r));
    const dist = { [hc + ',' + hr]: 0 }; const q = [[hc, hr]]; let bonus = 0;
    while (q.length) {
      const [c, r] = q.shift(); const d = dist[c + ',' + r];
      for (const [dx, dy] of DIRS) {
        const nc = c + dx, nr = r + dy, k = nc + ',' + nr;
        if (!this.free(nc, nr, true) || seen.has(k) || k in dist) continue;
        dist[k] = d + 1; if (this.refills[k] && !this.refills[k].taken) bonus += REFILL;
        if (!(nc === this.goal[0] && nr === this.goal[1])) q.push([nc, nr]);
      }
    }
    const g = dist[this.goal[0] + ',' + this.goal[1]];
    return { ok: g !== undefined, far: g !== undefined && g > this.remaining + bonus };
  }
  checkDeadEnd() {
    if (this.toys.length || Object.keys(this.spools).length) {
      if (this.solveToys()) { this.deadSaid = false; return; }
      if (this.deadSaid) return; this.deadSaid = true;
      this.mood('annoyed', 900); this.emote('?');
      this.say(!this.toys.length ? 'Impasse ! Reviens sur tes pas.' : Object.keys(this.pushes).length ? 'Impasse ! Annule pour remettre le canard en place.' : 'Impasse : par ici, le canard finirait coincé. Reviens en arrière.', 3400); this.pulseUndo(); return;
    }
    const R = this.reach();
    if (R.ok && !R.far) { this.deadSaid = false; return; }
    if (this.deadSaid) return; this.deadSaid = true;
    this.mood('annoyed', 900); this.emote('?');
    if (this.L.tut === 'rewind' && !(Save.tuts || {})[this.n]) { this.tutorial('stuck'); return; }
    this.say(R.ok ? 'Pas assez de laine pour arriver : reviens un peu en arrière.' : 'Impasse ! Le panier est bloqué : reviens sur tes pas.', 3400);
    this.pulseUndo();
  }
  pulseUndo() { if (!this.undoBtn || Save.reduce) return; this.tweens.killTweensOf(this.undoBtn); this.undoBtn.setScale(1); this.tweens.add({ targets: this.undoBtn, scale: 1.12, duration: 220, yoyo: true, repeat: 3, ease: 'Sine.easeInOut', onComplete: () => this.undoBtn.setScale(1) }); }

    this.tweens.killTweensOf(b); b.shadow.setVisible(false);
    const p = this.tf(...b.tile);
    this.objs.remove(b); this.threadL.add(b);
    this.tweens.add({ targets: b, y: p.y - 34 * this.G.k, scale: b.baseS * 1.3, angle: 180, duration: 200, ease: 'Quad.easeOut', onComplete: () =>
      this.tweens.add({ targets: b, x: p.x, y: p.y, scale: b.baseS * 0.56, angle: 360, duration: 240, ease: 'Bounce.easeOut', onComplete: () => { b.angle = 0; } }) });

  uncollect(key, quiet) {

  // bonus yarn balls are absorbed into the kitten's ball
  absorb(key) {

  // ---------- yarn on the floor : from the cushion, along the path, to the ball
  drawYarnPath() {
    const key = this.cuts.length + '/' + this.path.length + ':' + Math.round(this.catPos.x) + ',' + Math.round(this.catPos.y) + ':' + this.mode + ':' + Math.round(this.ball.x) + ',' + Math.round(this.ball.y);
    if (key === this.yarnKey) return; this.yarnKey = key;
    const g = this.yarnG; g.clear();
    const ls = this.liveStart(); const sp0 = ls ? this.tf(...this.path[ls]) : null;
    const pts = [ls ? { x: sp0.x, y: sp0.y - 14 * this.G.k } : this.anchor];
    const centers = this.path.slice(ls).map(([c, r]) => this.tf(c, r));
    (this.mode === 'fwd' ? centers.slice(0, -1) : centers).forEach(p => pts.push(p));
    const lastP = pts[pts.length - 1]; if (Math.hypot(lastP.x - this.catPos.x, lastP.y - this.catPos.y) > 0.5) pts.push({ x: this.catPos.x, y: this.catPos.y });

    const sm = pts.length > 2 ? new Phaser.Curves.Spline(pts.map(p => new Phaser.Math.Vector2(p.x, p.y))).getPoints(pts.length * 5) : pts;
    yarnStroke(g, sm, Math.round(9 * Math.min(1.25, this.G.k)));
  }

  // ---------- tutorials : one per mini-level, shown once
  handTo(from, to) {

    const a = this.tc(...from), b = this.tc(...to); const k = this.G.k;
    const hand = this.img(a.x - 6, a.y + 34 * k, 'hand').setScale(0.8).setDepth(40); this.world.add(hand); this.tutHand = hand;
    this.tweens.add({ targets: hand, x: b.x - 6, y: b.y + 34 * k, duration: 900, delay: 300, repeat: -1, repeatDelay: 500, ease: 'Sine.easeInOut' });
  }
  dropHand() { if (this.tutHand) { this.tutHand.destroy(); this.tutHand = null; } }
  tutDone() { (Save.tuts || (Save.tuts = {}))[this.n] = true; persist(); this.tut = null; this.dropHand(); }
  tutorial(step) {
    this.tut = step; const kind = this.L.tut;
    if (kind === 'move') {
      if (step === 'start') { this.say('Glisse ton doigt vers une empreinte pour avancer.', 0); const r = this.solveFrom(); if (r) this.handTo(this.start, r[0]); }
      if (step === 'moved') { this.dropHand(); this.say('Bien ! Le fil te suit. Passe par le bouton, puis va au panier.', 3600); this.tutDone(); }
    }
    if (kind === 'cross' && step === 'start') { this.say('Le fil ne peut pas se croiser : regarde bien avant de partir !', 3800); this.tutDone(); }
    if (kind === 'push') {
      if (step === 'start') { this.say('Le canard bloque le chemin du panier. Pousse-le !', 0); }
      if (step === 'near') { const t = arguments[1]; this.say('Fonce dans le canard pour le pousser d\'une case.', 0); this.handTo(this.head(), [t.c, t.r]); this.tut = 'near'; }
      if (step === 'pushed') { this.dropHand(); this.say('Il roule ! Mais attention : jamais sur ton fil, ni contre un meuble.', 3600); this.tutDone(); }
    }
    if (kind === 'refill' && step === 'start') { this.say(`Seulement ${this.L.budget} laines… Les pelotes jaunes t'en redonnent !`, 0); this.tut = 'start'; }
    if (kind === 'refill' && step === 'absorbed') { this.say(`+${REFILL} laines ! Ta pelote grossit.`, 2600); this.tutDone(); }
    if (kind === 'rewind') {
      if (step === 'start') { this.say('Le bouton est tout en haut. Trouve le bon chemin !', 3000); this.tut = 'start'; }
      if (step === 'stuck') {
        this.say('Impasse ! Glisse vers la flèche pour ré-enrouler le fil.', 0); this.pulseUndo();
        const prev = this.path[this.path.length - 2]; if (prev) this.handTo(this.head(), prev);
      }
      if (step === 'rewound') {
        this.dropHand();
        const R = this.reach();
        if (R.ok && !R.far) { this.say('Bravo ! Le fil s\'enroule et ta laine revient.', 3200); this.tutDone(); }
        else { this.tut = 'stuck'; this.say('Encore ! Recule jusqu\'à trouver un autre chemin.', 0); const prev = this.path[this.path.length - 2]; if (prev) this.handTo(this.head(), prev); }
      }
    }
  }

  // ---------- hint : best route from the current state (buttons first, then laine kept)
  solveToys() {
    const ks = (o, f) => Object.keys(o).filter(k => f(o[k])), ls = this.liveStart();
    const justCut = this.cuts.length && ls === this.path.length - 1 && this.path.length > 1;
    const st = { pos: this.head(), live: this.path.slice(ls).map(([c, r]) => c + ',' + r), toys: this.toys.map(t => t.c + ',' + t.r), takenB: ks(this.buttons, b => b.taken), takenY: ks(this.refills, y => y.taken), usedR: ks(this.spools, s => s.used), ban: justCut ? this.path[this.path.length - 2].join(',') : null };
    const res = solveGrid(this.grid, this.remaining, 250000, st);
    return res.best ? res.best.route : null;
  }
  solveFrom() { return this.solveToys(); }
  showHintPath() {
    if (this.won || this.locked) return; this.clearHint();
    if (this.hintsLeft <= 0) { this.say('Plus d\'indices pour ce niveau. Tu peux y arriver !', 2400); return; }
    this.hintsLeft--;
    const route = this.solveFrom();
    if (!route) { this.say('Ce chemin est bloqué : reviens en arrière pour enrouler le fil.', 3200); this.pulseUndo(); return; }
    const k = this.G.k;
    route.slice(0, 3).forEach(([c, r], i) => {
      const p = this.tf(c, r); const m = this.img(p.x, p.y - 4, 'ball_mustard').setScale(0.001).setAlpha(0.9); this.world.add(m); this.hintMarks.push(m);
      this.tweens.add({ targets: m, scale: 0.26 * k, duration: 300, delay: i * 140, ease: 'Back.easeOut' });
      this.tweens.add({ targets: m, y: p.y - 12, duration: 500, delay: 300 + i * 140, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    });
    this.say('Suis les petites pelotes jaunes.', 2200);
  }
  clearHint() { this.hintMarks.forEach(m => m.destroy()); this.hintMarks = []; }

  // ---------- win : the kitten curls up in its basket and falls asleep
  win() {
    this.won = true; this.queue = []; this.drawHighlights(); this.clearHint(); this.dropHand();
    if (this.L.tut) this.tutDone();
    const allB = this.got === this.nb, kept = this.remaining >= this.L.keep;
    const stars = 1 + (allB ? 1 : 0) + (kept ? 1 : 0);
    const book = this.daily ? (Save.daily || (Save.daily = {})) : Save.levels, bk = this.daily ? this.dkey : this.n;
    const prev = book[bk] || 0; const gain = Math.max(0, stars - prev) * 10 + (prev ? 0 : 10);
    book[bk] = Math.max(prev, stars); Save.laine += gain; persist();
    const p = this.tc(...this.goal), k = this.G.k;
    this.tweens.add({ targets: [this.botC, this.sayBox, this.ballTxt], alpha: 0, duration: 250 });
    this.tweens.killTweensOf([this.goalRing, this.goalArrow]); this.goalRing.setVisible(false); this.goalTag.setVisible(false); this.goalArrow.setVisible(false);
    this.cat.root.sortY = this.basketBack.sortY + 0.3; this.ball.sortY = this.basketFront.sortY + 0.1; this.objs.sort('sortY');
    this.cat.setView('front'); this.cat.head.setMood('happy');
    Sound.fanfare(); buzz(40);
    this.tweens.add({ targets: this.cat.root, y: p.y - 40 * k, duration: 220, ease: 'Quad.easeOut', onComplete: () => this.tweens.add({ targets: this.cat.root, y: p.y + 10 * k, duration: 200, ease: 'Quad.easeIn', onComplete: () => this.curlUp(p) }) });
    // the ball rolls to rest next to the basket
    this.tweens.add({ targets: this.ball, x: p.x + 50 * k * (p.x > W / 2 ? -1 : 1), y: p.y + 36 * k, rotation: this.ball.rotation + 4, duration: 500, ease: 'Quad.easeOut' });
    const sp = this.toScreen(p);
    for (let i = 0; i < 18; i++) { const s = this.img(sp.x, sp.y - 60, i % 3 ? 'spark' : 'heart').setScale(0.3).setDepth(60); this.tweens.add({ targets: s, x: s.x + Phaser.Math.Between(-160, 160), y: s.y + Phaser.Math.Between(-220, 40), alpha: 0, scale: 0.8, angle: Phaser.Math.Between(-180, 180), duration: 1100, ease: 'Quad.easeOut', onComplete: () => s.destroy() }); }
    const cases = this.path.length - 1; const bests = Save.best || (Save.best = {}); const rkey = this.daily ? 'jour' + this.dkey : this.n; const prevBest = bests[rkey];
    this.newRecord = !prevBest || cases < prevBest; if (this.newRecord) bests[rkey] = cases; persist();
    this.time.delayedCall(900, () => {
      if (this.n === 1 && !Save.named) askName(`Bravo ! Comment s'appelle ton chaton\u00a0?`, 'Garder ' + catName(), (v) => { if (v) Save.name = v; Save.named = true; persist(); if (this.won && this.n === 1) this.winBar(stars, gain, [true, allB, kept]); });
      else this.winBar(stars, gain, [true, allB, kept]);
    });
  }
  curlUp(p) {
    const k = this.G.k;
    const rig = this.buildCurled(p.x + 8 * k, p.y + 16 * k, true); rig.root.setScale(0.36 * k);
    rig.root.sortY = this.basketBack.sortY + 0.3; this.objs.add(rig.root); this.objs.sort('sortY');
    rig.root.setAlpha(0); this.tweens.add({ targets: rig.root, alpha: 1, duration: 220 });
    this.tweens.add({ targets: this.cat.root, alpha: 0, duration: 220, onComplete: () => this.cat.root.setVisible(false) });
    this.sleeper = rig; rig.head.setMood('happy');
    this.tweens.add({ targets: rig.body, scaleY: { from: 1, to: 1.03 }, duration: 1300, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.time.delayedCall(700, () => { if (rig.head.scene) { rig.head.setMood('yawn'); this.time.delayedCall(900, () => { if (rig.head.scene) rig.head.setMood('sleep'); }); } });
    this.zTimer = this.time.addEvent({ delay: 1100, startAt: 0, loop: true, callback: () => {
      if (!rig.root.scene || rig.head.S.mood !== 'sleep') return;
      const wp = this.toScreen({ x: p.x + 20 * k, y: p.y - 30 * k });
      const z = this.txt(wp.x, wp.y, 'z', 34, { color: '#fff6ea', stroke: '#a4502a', strokeThickness: 6 }).setOrigin(0.5).setAlpha(0).setDepth(15);
      this.tweens.add({ targets: z, x: z.x + 40, y: z.y - 90, alpha: { from: 1, to: 0 }, scale: { from: 0.6, to: 1.3 }, duration: 2200, ease: 'Sine.easeOut', onComplete: () => z.destroy() });
    } });
  }
  // stars fly to the objectives, a small result card + next button; details on tap
  winBar(stars, gain, earned) {
    const from = this.toScreen(this.tc(...this.goal)); let i0 = 0;
    earned.forEach((ok, i) => {
      if (!ok) return; const d = 250 + (i0++) * 300;
      const target = { x: W / 2 + this.objStars[i].x, y: 196 };
      const s = this.img(from.x, from.y - 40, 'ic_star').setScale(0.2).setDepth(60);
      this.tweens.add({ targets: s, x: target.x, y: target.y, scale: 0.6, angle: 360, duration: 520, delay: d, ease: 'Cubic.easeInOut', onComplete: () => {
        s.destroy(); this.objStars[i].setFrame('ic_star').setAlpha(1); this.tweens.add({ targets: this.objStars[i], scale: { from: 0.75, to: 0.42 }, duration: 320, ease: 'Back.easeOut' });
        Sound.pop(660 + i * 220, 0.2, 'triangle', 0.12); buzz(12);
      } });
    });
    const y = Math.min(1360, this.sayY + 10);
    const c = this.add.container(W / 2, y + 60).setDepth(30).setAlpha(0);
    const g = this.add.graphics(); g.fillStyle(0x7a3518, 0.16); g.fillRoundedRect(-320, -54, 640, 116, 50); g.fillStyle(0xfff6ea, 1); g.fillRoundedRect(-320, -60, 640, 116, 50);
    g.lineStyle(2.5, 0xc8784a, 0.35); g.strokeRoundedRect(-310, -50, 620, 96, 42); c.add(g);
    for (let i = 0; i < 3; i++) {
      const x = -250 + i * 56, sy = i === 1 ? -10 : -2;
      c.add(this.img(x, sy, 'ic_star_off').setScale(0.6));
      if (i < stars) { const st = this.img(x, sy, 'ic_star').setScale(0); c.add(st); this.tweens.add({ targets: st, scale: 0.6, duration: 360, delay: 700 + i * 220, ease: 'Back.easeOut' }); }
    }
    c.add(this.txt(-80, -24, stars === 3 ? 'Parfait !' : 'Bravo !', 32, { fontStyle: '700' }).setOrigin(0, 0.5));
    const cases = this.path.length - 1, opt = this.optimum;
    const l1 = gain > 0 ? `+${gain} laine` : 'Déjà gagné';
    const l2 = `${cases} cases` + (opt ? (cases <= opt ? ' · le minimum !' : ` · minimum ${opt}`) : '') + (this.newRecord && gain <= 0 ? ' · record' : '');
    if (gain > 0) c.add(this.img(-66, 8, 'ball_mustard').setScale(0.22));
    c.add(this.txt(gain > 0 ? -50 : -80, 8, l1, 21, { fontStyle: '600', color: '#9a5a36' }).setOrigin(0, 0.5));
    c.add(this.txt(-80, 32, l2, 19, { fontStyle: '500', color: cases <= opt ? '#4f8a7a' : '#9a5a36' }).setOrigin(0, 0.5));
    c.add(this.txt(292, 0, 'Détails ›', 23, { fontStyle: '600', color: '#c06a3c' }).setOrigin(1, 0.5));
    const hz = this.add.zone(0, 0, 640, 116); c.add(hz); this.tapify(hz, () => { if (!this.panel) this.winPanel(stars, gain); });
    this.tweens.add({ targets: c, y, alpha: 1, duration: 380, delay: 300, ease: 'Back.easeOut' });
    // bottom buttons
    const next = this.n + 1, hasNext = !!(PLAYABLE[next] && LEVELS[next]);
    const home = () => { this.registry.set('fromLevel', true); this.registry.set('afterLevelToast', gain ? `+${gain} laine gagnée !` : null); this.goScene('home', 'Pelote', 'Retour à la maison'); };
    const b = this.add.container(0, 60).setDepth(30).setAlpha(0);
    b.add(this.pillBtn(W / 2 - 236, 1500, 150, 96, '', 0xc9a98c, () => this.scene.restart({ n: this.n, daily: this.daily, quick: true }), { icon: 'ic_restart' }));
    b.add(this.pillBtn(W / 2 - 70, 1500, 150, 96, '', 0xc9a98c, home, { icon: 'ic_house' }));
    const nb = hasNext ? this.pillBtn(W / 2 + 160, 1500, 290, 96, 'Niveau ' + next, 0xe0703a, () => this.goScene('level', 'Le Salon', `Niveau ${next}`, { n: next }), { size: 30 })
      : this.pillBtn(W / 2 + 160, 1500, 290, 96, 'Continuer', 0xe0703a, home, { size: 30 });
    b.add(nb);
    this.tweens.add({ targets: b, y: 0, alpha: 1, duration: 380, delay: 500, ease: 'Back.easeOut', onComplete: () => { if (!Save.reduce) this.tweens.add({ targets: nb, scale: 1.04, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' }); } });
  }
  winPanel(stars, gain) {
    const next = this.n + 1, hasNext = !!(PLAYABLE[next] && LEVELS[next]);
    const build = (S, y0) => {
      const h = this.buildHead(true, 0.95); h.setMood('happy'); h.setPosition(W / 2, y0 + 80); S.add(h); this.tweens.add({ targets: h, angle: { from: -6, to: 6 }, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      for (let i = 0; i < 3; i++) {
        const x = W / 2 + (i - 1) * 140, y = y0 + 240 - (i === 1 ? 20 : 0);
        S.add(this.img(x, y, 'ic_star_off').setScale(1.5));
        if (i < stars) { const s = this.img(x, y, 'ic_star').setScale(0); S.add(s); this.tweens.add({ targets: s, scale: 1.5, duration: 420, delay: 300 + i * 320, ease: 'Back.easeOut', onStart: () => Sound.pop(660 + i * 220, 0.2, 'triangle', 0.12) }); }
      }
      const bl = this.nb > 1 ? `${this.nb} boutons enfilés` : 'Bouton enfilé';
      const lines = [['Arrivé au panier', true], [bl, this.got === this.nb], [`Garder ${this.L.keep} laines (il t'en reste ${this.remaining})`, this.remaining >= this.L.keep]];
      lines.forEach(([l, ok], i) => { const y = y0 + 360 + i * 64; S.add(this.img(110, y, ok ? 'ic_check' : 'ic_star_off').setScale(ok ? 0.5 : 0.36)); S.add(this.txt(150, y, l, 27, { fontStyle: ok ? '600' : '500', color: ok ? INK : '#a68a72' }).setOrigin(0, 0.5)); });
      if (gain > 0) { S.add(this.img(W / 2 - 70, y0 + 548, 'ball_mustard').setScale(0.42)); S.add(this.txt(W / 2 - 36, y0 + 548, `+${gain} laine`, 34, { fontStyle: '700' }).setOrigin(0, 0.5)); }
      const bests = Save.best || {}; S.add(this.txt(W / 2, y0 + 600, `Chemin : ${this.path.length - 1} cases · ton record : ${bests[this.daily ? 'jour' + this.dkey : this.n] || this.path.length - 1}` + (this.optimum ? ` · minimum : ${this.optimum}` : ''), 23, { fontStyle: '600', color: '#9a5a36' }).setOrigin(0.5));
      if (stars < 3) S.add(this.txt(W / 2, y0 + 640, this.got < this.nb ? 'Astuce : prends les boutons dans le bon ordre.' : 'Astuce : un chemin plus court garde plus de laine.', 23, { fontStyle: '500', color: '#9a5a36' }).setOrigin(0.5));
      const home = () => { this.registry.set('fromLevel', true); this.registry.set('afterLevelToast', gain ? `+${gain} laine gagnée !` : null); this.goScene('home', 'Pelote', 'Retour à la maison'); };
      S.add(this.pillBtn(W / 2 - 236, H - 130, 150, 96, '', 0xc9a98c, () => { this.panel = null; this.scene.restart({ n: this.n, daily: this.daily, quick: true }); }, { size: 30, icon: 'ic_restart' }));
      S.add(this.pillBtn(W / 2 - 70, H - 130, 150, 96, '', 0xc9a98c, home, { size: 30, icon: 'ic_house' }));
      if (hasNext) S.add(this.pillBtn(W / 2 + 160, H - 130, 290, 96, 'Niveau ' + next, 0xe0703a, () => { this.goScene('level', 'Le Salon', `Niveau ${next}`, { n: next }); }, { size: 30 }));
      else S.add(this.pillBtn(W / 2 + 160, H - 130, 290, 96, 'Continuer', 0xe0703a, home, { size: 30 }));
    };
    this.openPanel(stars === 3 ? 'Parfait !' : 'Bravo !', 1000, build);
  }

  update(time, delta) {
    const dt = Math.min(delta, 50) / 1000; this.t += dt;
    if (this.cat.root.visible) {
      this.cat.draw(this.t, dt);
      // the shadow stays on the floor while the kitten hops, and shifts with the light
      const lift = (this.catPos.y - this.cat.root.y) / this.catS, sh = this.cat.shadow;
      sh.setPosition(this.shadowOff[0] * (this.cat.dir || 1) * (this.cat.flip.scaleX < 0 ? -1 : 1), lift + 2 + this.shadowOff[1]); sh.setScale(Math.max(0.6, 1 - lift * 0.01) * (this.cat.view === 'side' ? 1 : 0.72), 1); sh.setAlpha(Math.max(0.4, 1 - lift * 0.012));
    }
    if (!this.won) this.placeBall(false);
    if (this.cat.view === 'back' && !this.busy && !this.queue.length && (this.turnT = (this.turnT || 0) + dt) > 0.8) { this.cat.setView('front'); this.turnT = 0; } else if (this.busy) this.turnT = 0;
    this.toys.forEach(t => { if (t.shadowG) { t.shadowG.setPosition(t.x + this.shadowOff[0] * this.G.k, t.y + (10 + this.shadowOff[1]) * this.G.k); } });
    if (this.sleeper && this.sleeper.root.scene) { this.sleeper.drawTail(this.t); this.sleeper.head.update(dt); }
    this.sayHead.update(dt);
    this.drawYarnPath();
    if (this.ballTxt && !this.won) {
      const r = this.ball.displayHeight / 2;
      this.ballTxt.setPosition(this.ball.x - (this.cat.view === 'back' ? r + 16 * this.G.k : 0), this.ball.y + (this.cat.view === 'back' ? 0 : r + 12 * this.G.k)).setVisible(this.ball.scale > 0.05);
      if (this.lastRem !== this.remaining) {
        if (this.lastRem !== null && !Save.reduce) this.tweens.add({ targets: this.ballTxt, scale: { from: 1.35, to: 1 }, duration: 220, ease: 'Back.easeOut' });
        this.lastRem = this.remaining; this.ballTxt.setText(String(this.remaining)).setStroke(this.remaining <= 3 ? '#d9483f' : '#7a3518', 6);
      }
    }
    if (Math.floor(this.t) !== this.lastSec) { this.lastSec = Math.floor(this.t); this.drawClock(); if (this.lastSec % 5 === 0 && this.mouseToy && !Save.reduce) this.squeakIdle(); }
    if (!Save.reduce) {
      Object.values(this.buttons).forEach((b, i) => { if (b && !b.taken) b.y = b.baseY + Math.sin(this.t * 2.4 + i) * 4; });
      Object.values(this.refills).forEach((y, i) => { if (y && !y.taken) { y.y = y.baseY + Math.sin(this.t * 2 + i * 1.7) * 5; y.angle = Math.sin(this.t * 1.3 + i) * 6; } });
    }
    if (!this.locked && !this.won && !this.busy && !this.panel) {
      this.idleT += dt;
      if (this.idleT > 4) { this.lookIn -= dt; if (this.lookIn <= 0) { this.lookIn = 1.2 + Math.random() * 1.5; this.cat.head.lookAt(Math.random() * 2 - 1, Math.random() * 1.2 - 0.6); if (Math.random() < 0.3) this.cat.head.twitch(); } }
      if (this.idleT > 10 && !this.yawned) { this.yawned = true; this.mood('yawn', 1100); Sound.pop(280, 0.6, 'sine', 0.04); }
      if (this.idleT < 1) this.yawned = false;
    } else this.idleT = 0;
  }
  squeakIdle() { const m = this.mouseToy; if (this.tweens.isTweening(m)) return; this.tweens.add({ targets: m, y: m.baseY - 6, angle: 8, duration: 200, yoyo: true, ease: 'Sine.easeInOut', onComplete: () => { m.angle = 0; m.y = m.baseY; } }); }
}

// ---------- boot ----------
function start() {
  document.getElementById('boot').remove();
  window.__game = new Phaser.Game({
    type: Phaser.AUTO, audio: { noAudio: true }, parent: 'game', transparent: true,
    render: { maxTextures: 1 },
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: W, height: H },
    scene: [Boot, Home, Level],

}
const fontsReady = Promise.all(["700 120px 'Fredoka'", "500 40px 'Fredoka'", "600 40px 'Fredoka'"].map(f => document.fonts ? document.fonts.load(f) : Promise.resolve()));
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(start, start);
})();
